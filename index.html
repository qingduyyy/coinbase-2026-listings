<style>
  :root{--bg:#0b0e14;--card:#151a23;--card2:#1c222d;--line:#2a313d;--fg:#e6e9ef;--mut:#8b94a3;

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--acc);text-decoration:none}
  header{padding:16px 14px 10px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 80%,transparent);z-index:5}
  h1{font-size:19px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--mut)}
  .chip b{color:var(--fg)}
  .controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  input,select{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:8px 10px;font-size:14px}
  input#q{flex:1;min-width:140px}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:var(--card);color:var(--mut);border:0;padding:8px 10px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#fff}
  main{padding:8px 12px 90px}
  .grid{display:grid;grid-template-columns:1fr;gap:8px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;position:relative}
  .card:active{transform:scale(.997)}
  .row1{display:flex;align-items:center;gap:9px}
  .ico{width:30px;height:30px;border-radius:50%;background:var(--card2);flex:0 0 auto;object-fit:cover}
  .sym{font-weight:700}
  .nm{color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 0}
  .b{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
  .b.spot{color:#7cc4ff;border-color:#244a6b}
  .b.perp{color:#c79bff;border-color:#473066}
  .b.equity{color:#ffd27c;border-color:#6b5524}.b.etf{color:#ffd27c;border-color:#6b5524}.b.commodity{color:#e3b873;border-color:#6b5524}
  .b.crypto{color:#7ee0c0;border-color:#245049}
  .met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:12px}
  .met div{background:var(--card2);border-radius:8px;padding:6px 7px;text-align:center}
  .met .k{color:var(--mut);font-size:10px;display:block;margin-bottom:1px}
  .up{color:var(--up)}.down{color:var(--down)}
  .date{position:absolute;top:12px;right:12px;color:var(--mut);font-size:11.5px}
  .cmp{position:absolute;bottom:10px;right:10px}
  .cmp input{width:18px;height:18px}
  /* overlay */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line)}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:16px}}
  .sheet h2{margin:0 0 2px;font-size:18px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:10px 0}
  .kv .k{color:var(--mut)}
  .close{float:right;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
  .cat{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 7px;margin:2px 3px 0 0;font-size:11px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  .cmpbar{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:1px solid var(--line);padding:10px 14px;display:none;align-items:center;gap:10px;z-index:15}
  .cmpbar.show{display:flex}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .muted{color:var(--mut)} .small{font-size:12px}
  .sect{margin-top:13px}
  .seclabel{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .topbtns{display:flex;gap:8px;margin:2px 0 10px}
  .tbtn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer}
  .tbtn.primary{background:linear-gradient(135deg,#2c7be5,#7c3aed);border:0;color:#fff}
  .ins-tag{font-size:12px;color:var(--mut);font-weight:600}
  .ins-ul{margin:4px 0;padding-left:18px} .ins-ul li{margin:4px 0;font-size:13px}
  .cl-entry{border-top:1px solid var(--line);padding:10px 0} .cl-date{font-weight:700;font-size:13px}
</style>
</head>

const fmtPrice=v=>v==null?'—':(v<1?('$'+v.toPrecision(3)):('$'+v.toLocaleString(undefined,{maximumFractionDigits:2})));
const stageOf=p=>{const s=p.spot_date,k=p.perp_date;return s&&k?'both':s?'spot':k?'perp':'';};

function passes(p){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const cls=document.getElementById('cls').value, st=document.getElementById('stage').value;
  if(q && !(p.symbol.toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q))) return false;
  if(cls && p.asset_class!==cls) return false;
  if(st){const so=stageOf(p); if(st==='both'&&so!=='both')return false; if(st!=='both'&&!(p[st+'_date']))return false;}
  return true;
}
function sortKey(){
  const s=document.getElementById('sort').value;
  const by=(f,dir=1)=>(a,b)=>{const x=a[f],y=b[f];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*dir;};
  if(s==='date')return (a,b)=>(b.first_date||'').localeCompare(a.first_date||'');
  if(s==='date_asc')return (a,b)=>(a.first_date||'').localeCompare(b.first_date||'');
  if(s==='name')return (a,b)=>a.symbol.localeCompare(b.symbol);
  if(s==='day1')return by('day1',-1); if(s==='day30')return by('day30',-1);
  if(s==='dd')return by('max_dd',-1); if(s==='mcap')return by('mcap',-1);
  return (a,b)=>0;
}
function card(p){
  const so=stageOf(p);
  const badges=[`<span class="b ${p.asset_class}">${p.asset_class}</span>`]
    .concat(p.spot_date?['<span class="b spot">spot</span>']:[])
    .concat(p.perp_date?[`<span class="b perp">perp${p.perp_state==='DELISTED'?' ✗':''}</span>`]:[]).join('');
  const ico=p.icon?`<img class="ico" src="${p.icon}" onerror="this.style.visibility='hidden'">`:`<div class="ico"></div>`;
  return `<div class="card" onclick="detail('${p.symbol}')">
    <span class="date">${p.first_date||''}</span>
    <div class="row1">${ico}<div style="min-width:0"><div class="sym">${p.symbol}</div><div class="nm">${p.name||''}</div></div></div>
    <div class="badges">${badges}</div>
    <div class="met">
      <div><span class="k">Day 1</span>${fmtPct(p.day1)}</div>
      <div><span class="k">Day 30</span>${fmtPct(p.day30)}</div>
      <div><span class="k">Max DD</span>${p.max_dd==null?'<span class=muted>—</span>':('-'+p.max_dd.toFixed(0)+'%')}</div>
      <div><span class="k">Mkt cap</span>${fmtUsd(p.mcap)}</div>
    </div>
    <label class="cmp" onclick="event.stopPropagation()"><input type="checkbox" ${sel.has(p.symbol)?'checked':''} onchange="toggle('${p.symbol}',this.checked)"></label>
  </div>`;
}
function render(){
  const list=P.filter(passes).sort(sortKey());
  document.getElementById('grid').innerHTML=list.map(card).join('');
  document.getElementById('empty').style.display=list.length?'none':'block';
}
function toggle(sym,on){on?sel.add(sym):sel.delete(sym);updateBar();}
function clearCmp(){sel.clear();updateBar();render();}
function updateBar(){const b=document.getElementById('cmpbar');b.classList.toggle('show',sel.size>0);
  document.getElementById('cmpcount').textContent=sel.size+' selected';}
function hide(){document.getElementById('ov').classList.remove('show');}
function show(html){document.getElementById('sheet').innerHTML=html;document.getElementById('ov').classList.add('show');}

function showInsight(){
  const i=INSIGHT||{};
  if(!i.headline){show('<span class="close" onclick="hide()">×</span><p class="muted">No insight generated yet.</p>');return;}
  const ev=(i.evidence||[]).map(e=>`<li>${e}</li>`).join('');
  const also=(i.also_notable||[]).map(a=>`<div class="small" style="margin:4px 0"><span class="b">${a.tag}</span> ${a.headline}</div>`).join('');
  show(`<span class="close" onclick="hide()">×</span>
    <div class="ins-tag">💡 Today's Insight · ${i.date||''} · ${i.tag||''} <span class="b">${(i.confidence||'').toUpperCase()}</span></div>
    <h2 style="margin:6px 0 2px">${i.headline}</h2>
    ${i.dek?`<p class="muted" style="margin:0 0 10px">${i.dek}</p>`:''}
    ${ev?`<div class="seclabel">Evidence</div><ul class="ins-ul">${ev}</ul>`:''}
    ${i.why_it_matters?`<div class="seclabel">Why it matters</div><p class="small">${i.why_it_matters}</p>`:''}
    ${i.what_to_watch?`<div class="seclabel">What to watch</div><p class="small">${i.what_to_watch}</p>`:''}
    ${also?`<div class="seclabel" style="margin-top:12px">Also notable</div>${also}`:''}
    <p class="small muted" style="margin-top:14px">${i.method||''}</p>`);
}
function showChangelog(){
  const rows=(CHANGELOG||[]).map(e=>{
    const adds=(e.added&&e.added.length)
      ? e.added.map(a=>`<div class="small"><span class="up">+ ${a.sym}</span> ${a.name||''} <span class="muted">[${a.stage||''}]${a.date?' · '+a.date:''}</span></div>`).join('')
      : '<div class="small muted">no listing changes</div>';
    const rem=(e.removed&&e.removed.length)?`<div class="small down">− removed: ${e.removed.join(', ')}</div>`:'';
    const c=e.counts||{};
    return `<div class="cl-entry"><div class="cl-date">${e.date} <span class="muted small">· ${e.note||''}</span></div>
      <div class="small muted">sources: ${(e.sources||[]).join(' · ')}</div>
      ${c.total?`<div class="small muted">totals: ${c.total} assets · ${c.spot} spot · ${c.perp} perp · ${c.crypto} crypto</div>`:''}
      ${adds}${rem}</div>`;
  }).join('');
  show(`<span class="close" onclick="hide()">×</span><h2>📋 Update Log</h2>${rows||'<p class="muted">No entries yet.</p>'}`);
}

function detail(sym){
  const p=P.find(x=>x.symbol===sym);
  const cats=(p.categories||[]).map(c=>`<span class="cat">${c}</span>`).join('');
  const links=[p.website?`<a href="${p.website}" target="_blank">site</a>`:'',
               p.x_handle?`<a href="https://x.com/${p.x_handle}" target="_blank">@${p.x_handle}</a>`:''].filter(Boolean).join(' · ');
  const kv=(k,v)=>`<div class="k">${k}</div><div>${v}</div>`;
  const inv=p.investors||[], leads=p.lead_investors||[], team=p.team||[];
  const invHtml = inv.length ? `<div class="sect"><div class="seclabel">Investors${p.total_raised?' · raised '+fmtUsd(p.total_raised):''}</div>`
    + (leads.length?`<div class="small" style="margin-bottom:5px"><b>Lead:</b> ${leads.join(', ')}</div>`:'')
    + `<div>${inv.map(i=>`<span class="cat">${i}</span>`).join('')}</div>`
    + ((p.funding&&p.funding.length)?`<div class="small muted" style="margin-top:6px">${p.funding.map(r=>`${r.round||'round'}${r.amount_usd?' '+fmtUsd(r.amount_usd):''}${r.date?' ('+r.date+')':''}`).join(' · ')}</div>`:'')
    + `</div>` : '';
  const teamHtml = team.length ? `<div class="sect"><div class="seclabel">Team${p.team_org?' · '+p.team_org:''}</div><div class="kv">${team.map(m=>`<div class="k">${m.role||''}</div><div>${m.name||''}</div>`).join('')}</div></div>` : '';
  show(`<span class="close" onclick="hide()">×</span>
    <h2>${p.symbol} <span class="muted small">${p.name||''}</span></h2>
    <div class="small muted">${p.asset_class}${p.chain?' · '+p.chain:''} ${links?' · '+links:''}</div>
    <div class="kv">
      ${kv('First listed', p.first_date||'—')}
      ${kv('Spot', p.spot_date?(p.spot_date+(p.spot_cross_check&&p.spot_cross_check!=='match'?` <span class=muted>(${p.spot_cross_check})</span>`:'')):'—')}
      ${kv('Perp', p.perp_date?(p.perp_date+(p.perp_state&&p.perp_state!=='TRADING'?` <span class=muted>(${p.perp_state})</span>`:'')):'—')}
      ${kv('Day 1 / 7 / 30 / 90', [p.day1,p.day7,p.day30,p.day90].map(fmtPct).join(' / '))}
      ${kv('ATH multiple', p.ath_multiple==null?'—':p.ath_multiple.toFixed(2)+'×')}
      ${kv('Max drawdown', p.max_dd==null?'—':'-'+p.max_dd.toFixed(0)+'%')}
      ${kv('Price', fmtPrice(p.price))}
      ${kv('Market cap', fmtUsd(p.mcap))}
      ${kv('FDV', fmtUsd(p.fdv))}
      ${kv('Circulating', p.circ_pct==null?'—':p.circ_pct.toFixed(0)+'%')}
      ${kv('Perp OI', p.perp_oi==null?'—':p.perp_oi.toLocaleString())}
      ${kv('Perp 24h notional', fmtUsd(p.perp_notional_24h))}
      ${kv('Avg vol (30d)', fmtUsd(p.vol30))}
    </div>
    ${invHtml}${teamHtml}
    ${cats?`<div class="sect">${cats}</div>`:''}
    ${p.about?`<p class="small muted">${p.about}</p>`:''}`);
}

const ROWS=[['First date','first_date',v=>v||'—'],['Asset class','asset_class',v=>v],
 ['Spot date','spot_date',v=>v||'—'],['Perp date','perp_date',v=>v||'—'],
 ['Day 1','day1',fmtPct],['Day 7','day7',fmtPct],['Day 30','day30',fmtPct],['Day 90','day90',fmtPct],
 ['ATH mult','ath_multiple',v=>v==null?'—':v.toFixed(2)+'×'],['Max DD','max_dd',v=>v==null?'—':'-'+v.toFixed(0)+'%'],
 ['Price','price',fmtPrice],['Market cap','mcap',fmtUsd],['FDV','fdv',fmtUsd],
 ['Circ %','circ_pct',v=>v==null?'—':v.toFixed(0)+'%'],['Perp 24h notl','perp_notional_24h',fmtUsd],['Avg vol 30d','vol30',fmtUsd],
 ['Total raised','total_raised',fmtUsd],['# investors','investors',v=>(v&&v.length)?v.length:'—'],
 ['Lead investors','lead_investors',v=>(v&&v.length)?v.join(', '):'—'],['Team','team',v=>(v&&v.length)?v.map(m=>m.name).join(', '):'—']];
function showCompare(){
  const items=P.filter(x=>sel.has(x.symbol));
  if(items.length<1)return;
  const head='<th>Metric</th>'+items.map(p=>`<th>${p.symbol}</th>`).join('');
  const body=ROWS.map(([label,key,fmt])=>`<tr><td>${label}</td>`+items.map(p=>`<td>${fmt(p[key])}</td>`).join('')+'</tr>').join('');
  show(`<span class="close" onclick="hide()">×</span><h2>Compare (${items.length})</h2>
    <div style="overflow:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
}
render();
</script>
</body>
</html>
